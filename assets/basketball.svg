      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="88" fill="url(#ballShine)" stroke="#7c2d12" stroke-width="4" filter="url(#ballGlow)" />
